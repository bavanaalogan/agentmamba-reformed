[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentmamba"
version = "0.1.0"
description = "Plant-wide industrial episodic memory with a learned write gate and conditional evidence retrieval (research prototype)."
requires-python = ">=3.10,<3.12"
readme = "README.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
markers = [
    "model: tests that load real model weights (Mamba / MiniLM); deselect with -m 'not model'",
]
